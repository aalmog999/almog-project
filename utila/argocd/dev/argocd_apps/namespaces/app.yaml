apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
spec:
  project: namespaces
  source:
    repoURL: https://github.com/aalmog999/almog-project
    path: utila/argocd/dev/system/namespaces
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: 'argocd'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
