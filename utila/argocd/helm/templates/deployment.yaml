apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.fullname" . }}
  {{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
  {{- else }}
  namespace: {{ template "service.namespace" $ }}
  {{- end }}
  {{- with .Values.deployment.deploymentAnnotations }}
  annotations:
    {{- range $key, $value := .Values.deployment.deploymentAnnotations }}
    {{- printf "%s: %s" $key (tpl $value $ | quote) | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    {{- include "service.defaultLabels" . | nindent 4 }}
    {{- include "service.labels" . | nindent 4 }}
    {{- range $key, $value := .Values.deployment.deploymentLabels }}
    {{- printf "%s: %s" $key (tpl $value $ | quote) | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "service.defaultLabels" . | nindent 6 }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.deployment.replicas }}
  {{- end }}
  strategy:
    type: {{ .Values.deployment.updateStrategy }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- range $key, $value := .Values.deployment.podAnnotations }}
        {{- printf "%s: %s" $key (tpl $value $ | quote) | nindent 8 }}
        {{- end }}
      labels:
        {{- include "service.defaultLabels" . | nindent 8 }}
        {{- include "service.labels" . | nindent 8 }}
        {{- range $key, $value := .Values.deployment.podLabels }}
        {{- printf "%s: %s" $key (tpl $value $ | quote) | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.deployment.affinity }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.extraInitContainers }}
      initContainers:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: {{ include "service.fullname" . }}
        {{- if .Values.deployment.securityContext }}
        securityContext:
          {{- toYaml .Values.deployment.securityContext | nindent 12 }}
        {{- end }}
        image: "{{ .Values.deployment.image }}:{{ .Values.deployment.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.deployment.imagePullPolicy }}
        {{- with .Values.deployment.command }}
        command:
          {{- toYaml $.Values.deployment.command | nindent 12 }}
        {{- end }}
        {{- with .Values.deployment.args }}
        args:
          {{- toYaml $.Values.deployment.args | nindent 12 }}
        {{- end }}
        {{- if .Values.deployment.lifecycleHooks }}
        lifecycle:
          {{- toYaml .Values.deployment.lifecycleHooks | nindent 12 }}
        {{- end }}
        {{- with .Values.deployment.env }}
        env:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.deployment.envFrom }}
        envFrom:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        {{- if not .Values.deployment.extraPorts }}
        - containerPort: {{ .Values.service.ports.port }}
          name: {{ .Values.service.ports.name }}
          protocol: TCP
        {{- end }}
        {{- with .Values.deployment.extraPorts }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.deployment.startupProbe.enabled }}
        startupProbe:
          failureThreshold: {{ .Values.deployment.startupProbe.failureThreshold }}
          periodSeconds: {{ .Values.deployment.startupProbe.periodSeconds }}
          successThreshold: {{ .Values.deployment.startupProbe.successThreshold }}
          timeoutSeconds: {{ .Values.deployment.startupProbe.timeoutSeconds }}
          initialDelaySeconds: {{ .Values.deployment.startupProbe.initialDelaySeconds }}
          {{- if .Values.deployment.startupProbe.exec }}
          exec:
            {{- toYaml .Values.deployment.startupProbe.exec | nindent 12 }}
          {{- else if .Values.deployment.startupProbe.httpGet }}
          httpGet:
            {{- toYaml .Values.deployment.startupProbe.httpGet | nindent 12 }}
          {{- else if .Values.deployment.startupProbe.tcpSocket }}
          tcpSocket:
            {{- toYaml .Values.deployment.startupProbe.tcpSocket | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if .Values.deployment.livenessProbe.enabled }} 
        livenessProbe:
          failureThreshold: {{ .Values.deployment.livenessProbe.failureThreshold }}
          periodSeconds: {{ .Values.deployment.livenessProbe.periodSeconds }}
          successThreshold: {{ .Values.deployment.livenessProbe.successThreshold }}
          timeoutSeconds: {{ .Values.deployment.livenessProbe.timeoutSeconds }}
          initialDelaySeconds: {{ .Values.deployment.livenessProbe.initialDelaySeconds }}
          {{- if .Values.deployment.livenessProbe.exec }}
          exec:
            {{- toYaml .Values.deployment.livenessProbe.exec | nindent 12 }}
          {{- else if .Values.deployment.livenessProbe.httpGet }}
          httpGet:
            {{- toYaml .Values.deployment.livenessProbe.httpGet | nindent 12 }}
          {{- else if .Values.deployment.livenessProbe.tcpSocket }}
          tcpSocket:
            {{- toYaml .Values.deployment.livenessProbe.tcpSocket | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if .Values.deployment.readinessProbe.enabled }} 
        readinessProbe:
          failureThreshold: {{ .Values.deployment.readinessProbe.failureThreshold }}
          periodSeconds: {{ .Values.deployment.readinessProbe.periodSeconds }}
          successThreshold: {{ .Values.deployment.readinessProbe.successThreshold }}
          timeoutSeconds: {{ .Values.deployment.readinessProbe.timeoutSeconds }}
          initialDelaySeconds: {{ .Values.deployment.readinessProbe.initialDelaySeconds }}
          {{- if .Values.deployment.readinessProbe.exec }}
          exec:
            {{- toYaml .Values.deployment.readinessProbe.exec | nindent 12 }}
          {{- else if .Values.deployment.readinessProbe.httpGet }}
          httpGet:
            {{- toYaml .Values.deployment.readinessProbe.httpGet | nindent 12 }}
          {{- else if .Values.deployment.readinessProbe.tcpSocket }}
          tcpSocket:
            {{- toYaml .Values.deployment.readinessProbe.tcpSocket | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if .Values.deployment.resources }}
        resources:
          {{- toYaml .Values.deployment.resources | nindent 10 }}
        {{- end }}
        {{- if or .Values.deployment.extraVolumes.enabled .Values.deployment.pvcVolumes.enabled .Values.configMap.enabled .Values.deployment.extraVolumeMounts .Values.secret.enabled }}
        volumeMounts:
        {{- if .Values.deployment.pvcVolumes.enabled }}
        {{- range $nameSuffix, $data := .Values.deployment.pvcVolumes.volumes }}
        - name: {{ template "service.name" $ }}-{{ $nameSuffix }}
          mountPath: {{ $data.mountPath }}
        {{- end }}
        {{- end }}
        {{- if .Values.configMap.enabled }}
        {{- range $nameSuffix, $data := .Values.configMap.files }}
        - name: {{ template "service.name" $ }}-{{ $nameSuffix }}
          mountPath: {{ $data.mountPath }}
          readOnly: true
        {{- end }}
        {{- end }}
        {{- if .Values.secret.enabled }}
        {{- range $nameSuffix, $data := .Values.secret.files }}
        - name: {{ template "service.name" $ }}-{{ $nameSuffix }}
          mountPath: {{ $data.mountPath }}
          readOnly: true
        {{- end }}
        {{- end }}
        {{- with .Values.deployment.extraVolumeMounts }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- with .Values.deployment.extraContainers }}
      {{- tpl . $ | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "service.serviceAccountName" . }}
      {{- if .Values.deployment.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.deployment.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: {{ .Values.deployment.enableServiceLinks }}
      restartPolicy: {{ .Values.deployment.restartPolicy }}
      {{- with .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      {{- if or .Values.deployment.extraVolumes.enabled .Values.deployment.pvcVolumes.enabled .Values.configMap.enabled .Values.secret.enabled }}
      volumes:
      {{- if .Values.deployment.pvcVolumes.enabled }}
      {{- range $nameSuffix, $data := .Values.deployment.pvcVolumes.volumes }}
      - name: {{ template "service.name" $ }}-{{ $nameSuffix }}
        persistentVolumeClaim:
          claimName: {{ template "service.name" $ }}-{{ $nameSuffix }}
      {{- end }}
      {{- end }}
      {{- with .Values.deployment.extraVolumes.volumes }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.configMap.enabled }}
      {{- range $nameSuffix, $data := .Values.configMap.files }}
      - name: {{ template "service.name" $ }}-{{ $nameSuffix }}
        configMap:
          name: {{ template "service.name" $ }}-{{ $nameSuffix }}
          defaultMode: 0744
      {{- end }}
      {{- end }}
      {{- if .Values.secret.enabled }}
      {{- range $nameSuffix, $data := .Values.secret.files }}
      - name: {{ template "service.name" $ }}-{{ $nameSuffix }}
        secret:
          secretName: {{ template "service.name" $ }}-{{ $nameSuffix }}
      {{- end }}
      {{- end }}
    {{- end }}
